<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><title>Mi Jornada · Horario</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark;--bg:#0a1210;--panel:#111c18;--line:#223a31;--ink:#eef5ef;--mut:#8fa59a;--lime:#c6ff3d;--pink:#ff3d8b;--cyan:#32e0ff}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);font:15px/1.4 Outfit,system-ui,"Segoe UI",sans-serif;min-height:100vh;
background:radial-gradient(ellipse at 15% 0,rgba(255,61,139,.16),transparent 45%),radial-gradient(ellipse at 90% 10%,rgba(50,224,255,.12),transparent 40%),repeating-linear-gradient(90deg,rgba(255,255,255,.018) 0 90px,transparent 90px 180px),var(--bg)}
.wrap{max-width:1280px;margin:0 auto;padding:18px 18px 60px}
h1,h3,.ko,.big{font-family:"Bebas Neue",Impact,"Arial Narrow",sans-serif;letter-spacing:.04em;font-weight:400}
header{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:16px}
h1{font-size:42px;margin:0;line-height:1;background:linear-gradient(90deg,var(--lime),var(--cyan));-webkit-background-clip:text;background-clip:text;color:transparent}
h1 small{display:block;font:600 12px Outfit,sans-serif;letter-spacing:.25em;color:var(--mut);-webkit-text-fill-color:var(--mut)}
.sp{flex:1}
.tabs{display:flex;gap:6px}
button,.btn{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:8px 14px;border-radius:10px}
.tabs button.on{background:var(--lime);color:#0a1210;border-color:var(--lime);font-weight:700}
.add{background:var(--pink);border-color:var(--pink);color:#fff;font-weight:700}
#hero{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:18px;padding:22px 24px;margin-bottom:20px;background:linear-gradient(120deg,#13241d,#0f1a2a);display:flex;gap:24px;align-items:center;flex-wrap:wrap}
#hero::after{content:"";position:absolute;right:-70px;top:50%;width:230px;height:230px;margin-top:-115px;border:3px solid rgba(198,255,61,.14);border-radius:50%;pointer-events:none}
.tag{font:700 12px Outfit,sans-serif;letter-spacing:.2em;color:var(--lime)}
.live .tag{color:var(--pink)}
.big{font-size:46px;line-height:1.05;margin:4px 0}
.sub{color:var(--mut)}
.cd{font:400 54px "Bebas Neue",Impact,sans-serif;color:var(--cyan);letter-spacing:.05em}
.hbtn{display:inline-block;background:var(--lime);color:#0a1210;font-weight:700;text-decoration:none;padding:13px 26px;border-radius:12px;font-size:17px;box-shadow:0 0 24px rgba(198,255,61,.35)}
.eq{display:flex;gap:4px;align-items:flex-end;height:34px}
.eq i{width:6px;background:var(--pink);border-radius:2px;animation:b 1s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:.2s;background:var(--lime)}.eq i:nth-child(3){animation-delay:.4s;background:var(--cyan)}.eq i:nth-child(4){animation-delay:.1s}.eq i:nth-child(5){animation-delay:.3s;background:var(--lime)}
@keyframes b{0%,100%{height:8px}50%{height:34px}}
@media (prefers-reduced-motion:reduce){.eq i{animation:none;height:20px}}
#week{overflow-x:auto;border:1px solid var(--line);border-radius:14px;-webkit-overflow-scrolling:touch}.tt{display:grid;grid-template-columns:54px repeat(var(--n),minmax(120px,1fr));min-width:calc(54px + var(--n)*124px);background:rgba(17,28,24,.9)}.dh{font:400 20px "Bebas Neue",Impact,sans-serif;letter-spacing:.05em;text-align:center;padding:8px 4px;color:var(--mut);border-bottom:1px solid var(--line);border-left:1px solid var(--line)}.dh.today{color:var(--lime)}.axis{position:sticky;left:0;z-index:2;background:#111c18}.axis span{position:absolute;right:6px;transform:translateY(-50%);font-size:11px;color:var(--mut)}.axis span:first-child{transform:translateY(2px)}.col{position:relative;border-left:1px solid var(--line);background:repeating-linear-gradient(180deg,transparent 0 83px,var(--line) 83px 84px)}.col.today{background-color:rgba(198,255,61,.05)}.blk{position:absolute;left:3px;right:3px;--c:var(--lime);background:color-mix(in srgb,var(--c) 22%,#101c17);border-left:4px solid var(--c);border-radius:8px;padding:4px 7px;overflow:hidden;cursor:pointer;font-size:12px;line-height:1.25}.blk b{display:block;font-size:13px}.blk span{display:block;color:var(--mut)}.blk a{display:inline-block;margin-top:2px;font-weight:700;color:#0a1210;background:var(--c);padding:1px 9px;border-radius:6px;text-decoration:none}.sl{display:flex;gap:6px;align-items:center;margin-bottom:6px}.sl select{flex:1.4}.sl input{flex:1}.qt{margin:-6px 0 20px;padding:14px 18px;border-left:4px solid var(--pink);background:rgba(17,28,24,.8);border-radius:10px}.qt p{margin:4px 0 0;font-size:17px}
.day{background:rgba(17,28,24,.85);border:1px solid var(--line);border-radius:14px;padding:10px;min-height:150px}
.day h3{margin:0 0 8px;font-size:22px;color:var(--mut)}
.day.today{border-color:var(--lime);box-shadow:0 0 0 1px var(--lime) inset}
.day.today h3{color:var(--lime)}
.rest{color:var(--mut);font-size:13px;margin:12px 0}
.match{--c:var(--lime);display:flex;flex-direction:column;gap:3px;border-left:4px solid var(--c);background:#16251f;border-radius:10px;padding:9px 10px;margin-bottom:8px;cursor:pointer}
.match:hover{background:#1c3027}
.ko{font-size:26px;line-height:1;color:var(--c)}.ko small{font:400 13px Outfit,sans-serif;color:var(--mut);margin-left:6px;letter-spacing:0}
.inf b{display:block;font-size:14.5px}.inf span{font-size:12.5px;color:var(--mut)}
.go{align-self:flex-start;margin-top:4px;font-size:12.5px;font-weight:700;text-decoration:none;color:#0a1210;background:var(--c);padding:4px 12px;border-radius:8px}
.panel{background:rgba(17,28,24,.9);border:1px solid var(--line);border-radius:14px;padding:14px}
input,select{font:inherit;color:var(--ink);background:#0d1713;border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%}
.row{display:flex;gap:10px;align-items:center;padding:10px;border-bottom:1px solid var(--line)}
.row:last-child{border:0}.row .dot{width:12px;height:12px;border-radius:50%;flex:none}
.row .t{flex:1;min-width:0}.row .t b{display:block}.row .t span{display:block;color:var(--mut);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
dialog{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:16px;padding:20px;width:min(480px,94vw)}
dialog::backdrop{background:rgba(0,0,0,.7)}
dialog h2{margin:0 0 12px;font:400 30px "Bebas Neue",Impact,sans-serif;letter-spacing:.04em;color:var(--lime)}
label.f{display:block;font-size:12.5px;color:var(--mut);margin:10px 0 4px}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{display:flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:20px;padding:5px 11px;font-size:13px;cursor:pointer}
.chip input{width:auto}.chip:has(input:checked){background:var(--lime);color:#0a1210;border-color:var(--lime);font-weight:700}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sw{display:flex;gap:8px}.sw label{width:30px;height:30px;border-radius:50%;cursor:pointer;border:3px solid transparent}.sw input{display:none}.sw label:has(input:checked){border-color:#fff}
.acts{display:flex;gap:8px;margin-top:16px}.acts .sp{flex:1}
.del{background:#4a1d2c;border-color:#7a2a45;color:#ffd0dc}
.ok{background:var(--lime);border-color:var(--lime);color:#0a1210;font-weight:700}
[hidden]{display:none!important}
</style></head><body><div class="wrap">
<header><h1>Mi Jornada<small>HORARIO DE CLASES VIRTUALES</small></h1><div class="sp"></div>
<div class="tabs"><button id="t1" class="on">Semana</button><button id="t2">Links</button><button id="t3">Respaldo</button></div>
<button class="add" id="new">+ Nueva clase</button></header>
<section id="hero"></section><div id="quote"></div>
<section id="v1"><div id="week"></div></section>
<section id="v2" hidden><div class="panel"><input id="q" placeholder="Buscar clase, profesor o link…"><div id="links"></div></div></section>
<section id="v3" hidden><div class="panel"><p class="sub">Tus clases se guardan en este navegador. Copia un respaldo para pasarlas a otro equipo o guardarlas.</p>
<button id="exp">Copiar respaldo</button> <button id="imp">Restaurar respaldo</button> <button id="clr" class="del">Borrar todo</button><textarea id="bk" rows="4" style="width:100%;margin-top:12px;font:inherit;color:var(--ink);background:#0d1713;border:1px solid var(--line);border-radius:8px;padding:9px" placeholder="Aquí aparece el respaldo. Para restaurar, pega el texto aquí y toca Restaurar respaldo."></textarea><p id="msg" class="sub"></p></div><div class="panel" style="margin-top:12px"><b>Mis frases</b><p class="sub">Añade tus propias frases, una por línea. Se mezclan con las del día.</p><textarea id="myq" rows="5" style="width:100%;font:inherit;color:var(--ink);background:#0d1713;border:1px solid var(--line);border-radius:8px;padding:9px"></textarea><button id="sq" style="margin-top:8px">Guardar mis frases</button> <span id="msg2" class="sub"></span></div></section>
</div>
<dialog id="dlg"><form id="frm" method="dialog"><h2 id="dt">Nueva clase</h2>
<label class="f">Materia</label><input id="fn" required>
<label class="f">Profesor</label><input id="fp">
<label class="f">Horarios (cada día puede tener su propia hora)</label><div id="fslots"></div><button type="button" id="fadd">+ Añadir otro horario</button>

<label class="f">Link de la clase (Zoom, Meet, Teams…)</label><input id="fl" placeholder="https://…">
<label class="f">Color</label><div class="sw" id="fc"></div>
<p id="err" style="color:#ff8fb1;margin:10px 0 0;font-size:13px"></p><div class="acts"><button type="button" id="fx" class="del">Eliminar</button><div class="sp"></div><button type="button" id="fcancel">Cancelar</button><button type="button" id="fsave" class="ok">Guardar</button></div></form></dialog>
<script>
const K="horario-futbol-v1",DN=["Domingo","Lunes","Martes","Miércoles","Jueves","Viernes","Sábado"],SH=["Dom","Lun","Mar","Mié","Jue","Vie","Sáb"],ORD=[1,2,3,4,5,6,0],COL=["#c6ff3d","#ff3d8b","#32e0ff","#ffb02e","#a77bff","#ff6b3d"];
const L=(n,l,c,s)=>({id:n,name:n,prof:'',link:'https://meet.google.com/'+l,color:c,slots:s.map(([d,a,b])=>({d,s:a,e:b}))});
const DEF=[L('Ciencias Sociales','qbh-ejdw-jvb','#c6ff3d',[[1,'07:30','08:15'],[1,'08:25','09:10'],[2,'07:30','08:15']]),L('Lengua y Literatura','gpj-sqky-rsi','#ff3d8b',[[1,'09:20','10:05'],[1,'10:15','11:00'],[4,'09:20','10:05'],[4,'10:15','11:00']]),L('Ciencias Naturales','pmt-zrxa-yed','#32e0ff',[[2,'08:25','09:10'],[3,'08:25','09:10'],[3,'09:20','10:05']]),L('OVP','pfs-naxm-nft','#ffb02e',[[2,'09:20','10:05']]),L('Matemáticas','axf-mbns-tga','#a77bff',[[2,'10:15','11:00'],[5,'09:20','10:05'],[5,'10:20','11:00'],[3,'10:15','11:00']]),L('Animación a la lectura','scf-drcs-hsq','#ff6b3d',[[3,'07:30','08:15']]),L('Educación Física','vie-kejk-ipi','#c6ff3d',[[4,'07:30','08:15']]),L('ECA','ywh-psbp-sde','#ffb02e',[[4,'08:25','09:10']]),L('Inglés','zym-qowa-cpx','#32e0ff',[[5,'07:30','08:15'],[5,'08:25','09:10']]),L('Acompañamiento integral','neo-igjp-duz','#ffb02e',[[5,'11:10','11:55']])];
let C=[],editId=null;
try{const r=localStorage.getItem(K);C=r===null?DEF:(JSON.parse(r)||[])}catch(e){C=DEF}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(C))}catch(e){}};
const $=i=>document.getElementById(i);
const esc=s=>String(s||"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const url=u=>u?(/^https?:\/\//i.test(u)?u:"https://"+u):"";
const pad=n=>String(n).padStart(2,"0");
function card(c){return `<div class="match" data-id="${c.id}" style="--c:${c.color}"><div class="ko">${c.start}<small>${c.end}</small></div><div class="inf"><b>${esc(c.name)}</b><span>${esc(c.prof)}</span></div>${c.link?`<a class="go" href="${esc(url(c.link))}" target="_blank" rel="noopener">Entrar</a>`:""}</div>`}
function week(){const t=new Date().getDay();$("week").innerHTML=ORD.map(d=>{const L=C.filter(c=>c.days.includes(d)).sort((a,b)=>a.start.localeCompare(b.start));return `<div class="day ${d==t?"today":""}"><h3>${DN[d]}${d==t?" · HOY":""}</h3>${L.length?L.map(card).join(""):'<p class="rest">Día de descanso 😴</p>'}</div>`}).join("")}
function nextOcc(){const now=new Date();let best=null;C.forEach(c=>{for(let i=0;i<8;i++){const d=new Date(now);d.setDate(d.getDate()+i);if(!c.days.includes(d.getDay()))continue;const[h1,m1]=c.start.split(":"),[h2,m2]=c.end.split(":");const s=new Date(d);s.setHours(+h1,+m1,0,0);const e=new Date(d);e.setHours(+h2,+m2,0,0);if(e>now&&(!best||s<best.s))best={c,s,e}}});return best}
function hero(){const n=nextOcc(),now=new Date(),H=$("hero");
 if(!n){H.className="";H.innerHTML=`<div><div class="tag">SIN PARTIDOS</div><div class="big">Aún no hay clases en el calendario</div><div class="sub">Toca «+ Nueva clase» para armar tu alineación.</div></div><div class="eq"><i></i><i></i><i></i><i></i><i></i></div>`;return}
 const live=n.s<=now,sec=Math.max(0,Math.floor(((live?n.e:n.s)-now)/1000)),d=Math.floor(sec/86400),h=Math.floor(sec%86400/3600),m=Math.floor(sec%3600/60),s=sec%60;
 const cd=d?`${d}d ${h}h ${m}m`:`${pad(h)}:${pad(m)}:${pad(s)}`;
 const day=n.s.toDateString()==now.toDateString()?"Hoy":(n.s-now<172800000&&n.s.getDate()!=now.getDate()&&Math.round((new Date(n.s).setHours(0,0,0,0)-new Date(now).setHours(0,0,0,0))/864e5)==1)?"Mañana":DN[n.s.getDay()];
 H.className=live?"live":"";
 H.innerHTML=`<div style="flex:1;min-width:240px"><div class="tag">${live?"● EN VIVO AHORA":"PRÓXIMO PARTIDO"}</div><div class="big">${esc(n.c.name)}</div><div class="sub">${esc(n.c.prof)}${n.c.prof?" · ":""}${day} ${n.c.start}–${n.c.end}</div></div>
 <div><div class="sub">${live?"Termina en":"Empieza en"}</div><div class="cd">${cd}</div></div>
 ${n.c.link?`<a class="hbtn" href="${esc(url(n.c.link))}" target="_blank" rel="noopener">⚽ Entrar a clase</a>`:""}<div class="eq"><i></i><i></i><i></i><i></i><i></i></div>`}
function links(){const q=$("q").value.toLowerCase(),L=C.filter(c=>(c.name+c.prof+c.link).toLowerCase().includes(q)).sort((a,b)=>a.name.localeCompare(b.name));
 $("links").innerHTML=L.length?L.map(c=>`<div class="row"><span class="dot" style="background:${c.color}"></span><div class="t"><b>${esc(c.name)}</b><span>${esc(c.prof)}${c.prof&&c.link?" · ":""}${esc(c.link)}</span></div>${c.link?`<a class="btn" href="${esc(url(c.link))}" target="_blank" rel="noopener">Abrir</a><button data-cp="${c.id}">Copiar</button>`:'<span class="sub">Sin link</span>'}</div>`).join(""):'<p class="rest">No hay clases que coincidan.</p>'}
function all(){week();hero();links()}
function openForm(id){editId=id||null;const c=C.find(x=>x.id==id)||{name:"",prof:"",days:[],start:"",end:"",link:"",color:COL[C.length%COL.length]};
 $("dt").textContent=id?"Editar clase":"Nueva clase";$("fn").value=c.name;$("fp").value=c.prof;$("fs").value=c.start;$("fe").value=c.end;$("fl").value=c.link;
 $("fd").innerHTML=ORD.map(d=>`<label class="chip"><input type="checkbox" value="${d}" ${c.days.includes(d)?"checked":""}>${SH[d]}</label>`).join("");
 $("fc").innerHTML=COL.map(k=>`<label style="background:${k}"><input type="radio" name="col" value="${k}" ${k==c.color?"checked":""}></label>`).join("");
 $("fx").hidden=!id;$("fx").textContent="Eliminar";$("err").textContent="";$("dlg").showModal()}
$("new").onclick=()=>openForm();
$("fcancel").onclick=()=>$("dlg").close();
$("fx").onclick=()=>{if($("fx").textContent!="¿Seguro? Toca otra vez"){$("fx").textContent="¿Seguro? Toca otra vez";return}C=C.filter(x=>x.id!=editId);save();$("dlg").close();all()};
$("frm").onsubmit=e=>e.preventDefault();$("fsave").onclick=()=>{const days=[...$("fd").querySelectorAll("input:checked")].map(i=>+i.value),s=$("fs").value,en=$("fe").value;
 $("err").textContent="";if(!$("fn").value.trim()||!s||!en){$("err").textContent="Falta la materia o las horas.";return}if(!days.length){$("err").textContent="Elige al menos un día.";return}
 if(en<=s){$("err").textContent="La hora de fin debe ser después del inicio.";return}
 const o={id:editId||Date.now(),name:$("fn").value.trim(),prof:$("fp").value.trim(),days,start:s,end:en,link:$("fl").value.trim(),color:$("fc").querySelector("input:checked").value};
 if(editId)C=C.map(x=>x.id==editId?o:x);else C.push(o);save();$("dlg").close();all()};
$("week").onclick=e=>{if(e.target.closest("a"))return;const m=e.target.closest(".match");if(m)openForm(m.dataset.id)};
$("q").oninput=links;
$("links").onclick=e=>{const id=e.target.dataset.cp;if(!id)return;const c=C.find(x=>x.id==id),u=url(c.link);(navigator.clipboard?navigator.clipboard.writeText(u):Promise.reject()).then(()=>{e.target.textContent="¡Copiado!";setTimeout(()=>e.target.textContent="Copiar",1500)},()=>{e.target.textContent="No se pudo copiar"})};
function tab(n){["v1","v2","v3"].forEach((v,i)=>{$(v).hidden=i!=n;$("t"+(i+1)).classList.toggle("on",i==n)})}
$("t1").onclick=()=>tab(0);$("t2").onclick=()=>tab(1);$("t3").onclick=()=>tab(2);
$("exp").onclick=()=>{$("bk").value=JSON.stringify(C);$("bk").select();(navigator.clipboard?navigator.clipboard.writeText($("bk").value):Promise.reject()).then(()=>$("msg").textContent="Respaldo copiado.",()=>$("msg").textContent="Copia el texto de la caja.")};
$("imp").onclick=()=>{try{const o=JSON.parse($("bk").value);if(!Array.isArray(o))throw 0;C=o;save();all();$("msg").textContent="Respaldo restaurado."}catch(e){$("msg").textContent="Ese texto no es un respaldo válido."}};
$("clr").onclick=()=>{if($("clr").textContent!="¿Seguro? Toca otra vez"){$("clr").textContent="¿Seguro? Toca otra vez";return}C=[];save();all();$("clr").textContent="Borrar todo"};
C=C.map(c=>c.slots?c:{...c,slots:(c.days||[]).map(d=>({d,s:c.start,e:c.end}))});
const tm=t=>{const[a,b]=t.split(':');return +a*60+ +b},HH=84;
function week(){
 const S=[];C.forEach(c=>c.slots.forEach(x=>S.push({c,...x})));
 const t=new Date().getDay(),days=ORD.filter(d=>(d>=1&&d<=5)||S.some(x=>x.d==d));
 let a=S.length?Math.floor(Math.min(...S.map(x=>tm(x.s)))/60):7,b=S.length?Math.ceil(Math.max(...S.map(x=>tm(x.e)))/60):13;
 if(b-a<5)b=a+5;
 const H=(b-a)*HH;
 let h=`<div class='tt' style='--n:${days.length}'><div></div>`+days.map(d=>`<div class='dh ${d==t?'today':''}'>${DN[d]}</div>`).join('');
 h+=`<div class='axis' style='height:${H}px'>`+Array.from({length:b-a},(_,i)=>`<span style='top:${i*HH}px'>${pad(a+i)}:00</span>`).join('')+`</div>`;
 days.forEach(d=>{h+=`<div class='col ${d==t?'today':''}' style='height:${H}px'>`+S.filter(x=>x.d==d).map(x=>{const top=(tm(x.s)-a*60)/60*HH,ht=Math.max(34,(tm(x.e)-tm(x.s))/60*HH-3);return `<div class='blk' data-id='${x.c.id}' style='--c:${x.c.color};top:${top}px;height:${ht}px'><b>${esc(x.c.name)}</b><span>${x.s}–${x.e}</span>${x.c.prof?`<span>${esc(x.c.prof)}</span>`:''}${x.c.link?`<a href="${esc(url(x.c.link))}" target='_blank' rel='noopener'>Entrar</a>`:''}</div>`}).join('')+`</div>`});
